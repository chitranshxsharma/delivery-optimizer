<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Delivery Optimizer</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="login-page">
  <div class="login-box fade-in">
    <div class="login-logo">
      <div class="icon-wrap">🚚</div>
      <h2>Route Optimizer</h2>
      <p>Delivery Intelligence Platform</p>
    </div>

    <div id="alert-area"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control"
               placeholder="admin@delivery.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control"
               placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="margin-top:0.5rem;" id="loginBtn">
        Sign In
      </button>
    </form>

    <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border);">
      <p style="font-size:0.72rem;color:var(--text-3);margin-bottom:8px;">Demo credentials (auto-seeded)</p>
      <div style="display:grid;gap:6px;">
        <div class="demo-cred" onclick="fillCred('admin@delivery.com','admin123')"
             style="background:var(--navy-3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;transition:background 0.15s;"
             onmouseover="this.style.background='var(--navy-4)'" onmouseout="this.style.background='var(--navy-3)'">
          <div style="font-size:0.75rem;font-weight:600;color:var(--orange);">Admin</div>
          <div style="font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--text-3);">admin@delivery.com / admin123</div>
        </div>
        <div class="demo-cred" onclick="fillCred('dispatcher@delivery.com','disp123')"
             style="background:var(--navy-3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;transition:background 0.15s;"
             onmouseover="this.style.background='var(--navy-4)'" onmouseout="this.style.background='var(--navy-3)'">
          <div style="font-size:0.75rem;font-weight:600;color:var(--teal);">Dispatcher</div>
          <div style="font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--text-3);">dispatcher@delivery.com / disp123</div>
        </div>
        <div class="demo-cred" onclick="fillCred('driver@delivery.com','driver123')"
             style="background:var(--navy-3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;transition:background 0.15s;"
             onmouseover="this.style.background='var(--navy-4)'" onmouseout="this.style.background='var(--navy-3)'">
          <div style="font-size:0.75rem;font-weight:600;color:var(--text-2);">Driver</div>
          <div style="font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--text-3);">driver@delivery.com / driver123</div>
        </div>
      </div>
    </div>

    <p style="text-align:center;margin-top:1.25rem;font-size:0.72rem;color:var(--text-3);">
      Need to track a package?
      <a href="/tracking" style="color:var(--orange);text-decoration:none;">Track here →</a>
    </p>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
function fillCred(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;

  const res = await API.post('/auth/login', {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });

  if (res.success && res.data?.token) {
    API.setToken(res.data.token);
    API.setUser({ name: res.data.name, email: res.data.email, role: res.data.role });
    window.location.href = '/dashboard';
  } else {
    document.getElementById('alert-area').innerHTML =
      `<div class="alert alert-danger">❌ ${res.message || 'Invalid credentials'}</div>`;
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
});

// Redirect if already logged in
if (API.getToken()) window.location.href = '/dashboard';
</script>
</body>
</html>
